<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title description">
  <title id="title">Steven Acreman — Platform engineering for applied AI</title>
  <desc id="description">A dark navy banner with teal accents and a diagram connecting build, evaluate and operate.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1423"/>
      <stop offset="1" stop-color="#152b3b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#a6d4dc" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="14" fill="url(#background)"/>
  <rect width="1280" height="300" rx="14" fill="url(#grid)"/>
  <rect x="56" y="47" width="42" height="4" rx="2" fill="#5fe0c4"/>
  <text x="56" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="49" font-weight="650" fill="#f3f7fb">Steven Acreman</text>
  <text x="57" y="163" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" fill="#c9d7e4">Platform engineering for applied AI.</text>
  <text x="57" y="238" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing="1.4" fill="#86cabc">KUBERNETES / GO / PYTHON / MODEL EVALUATION</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" text-anchor="middle">
    <path d="M 889 145 H 991 M 1025 145 H 1127" fill="none" stroke="#5fe0c4" stroke-opacity=".55" stroke-width="2"/>
    <path d="M 1144 163 V 214 H 872 V 163" fill="none" stroke="#5fe0c4" stroke-opacity=".24" stroke-width="1.5"/>
    <circle cx="872" cy="145" r="17" fill="#5fe0c4"/>
    <circle cx="1008" cy="145" r="17" fill="#173f43" stroke="#5fe0c4" stroke-width="2"/>
    <circle cx="1144" cy="145" r="17" fill="#173f43" stroke="#5fe0c4" stroke-width="2"/>
    <text x="872" y="108" fill="#c9d7e4">BUILD</text>
    <text x="1008" y="108" fill="#c9d7e4">EVALUATE</text>
    <text x="1144" y="108" fill="#c9d7e4">OPERATE</text>
  </g>
</svg>
